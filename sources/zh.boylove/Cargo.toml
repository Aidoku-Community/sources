[package]
name = "boylove"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", version = "0.3.0", features = ["json"] }
chinese-number = { version = "0.7", default-features = false, features = ["chinese-to-number"] }
chrono = { version = "0.4", default-features = false }
regex = { version = "1.11", default-features = false, features = ["unicode"] }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
spin = "0.10"
strum = { version = "0.27", default-features = false, features = ["derive"] }

[dev-dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", features = ["test"] }
aidoku-test = { git = "https://github.com/Aidoku/aidoku-rs.git" }
paste = "1.0.15"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
